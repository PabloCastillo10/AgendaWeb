<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO - LIST</title>
    <link rel="icon" type="image/png" href="assets/agenda.png" />
    <link  rel="stylesheet" href="style2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <video class="video-background" autoplay muted loop>
        <source src="assets/minecraft-dog.3840x2160.mp4" type="video/mp4">
       
      </video>
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-lg-8 col-md-10 col-sm-12">
            <h1 class="text-center mb-4 text-primary">ToDo List</h1>
            
          
            <div class="card border-0 shadow-sm mb-4">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Agregar una Tarea</h4>
              </div>
              <div class="card-body">
                <form id="todoForm">
                  <div class="mb-3">
                    <label for="taskName" class="form-label">Nombre de la Tarea</label>
                    <input type="text" id="taskName" class="form-control" placeholder="Escribe el nombre de la tarea">
                  </div>
                  <div class="mb-3">
                    <label for="taskPriority" class="form-label">Prioridad</label>
                    <select id="taskPriority" class="form-select">
                      <option value="1">Alta</option>
                      <option value="2">Media</option>
                      <option value="3">Baja</option>
                    </select>
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Agregar</button>
                </form>
              </div>
            </div>
      
           
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="text-secondary">Tareas Pendientes</h4>
              <div>
                <button id="sortHighToLow" class="btn btn-sm btn-outline-danger me-2">Prioridad: Alta → Baja</button>
                <button id="sortLowToHigh" class="btn btn-sm btn-outline-success">Prioridad: Baja → Alta</button>
              </div>
            </div>
      
            
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-light text-dark">
                <h5 class="mb-0">Lista de Tareas</h5>
              </div>
              <div class="card-body">
                <ul id="todoList" class="list-group"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    
      <a href="contacto.html" class="btn btn-primary mt-4 " style="margin-left: 900px;" >Regresar</a>
    
    <script  src="TodoList.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
