<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/agenda.png" />
</head>
<link rel="stylesheet" href="style2.css">
<body>
    <video class="video-background" autoplay muted loop>
      <source src="assets/starlit-landscape.3840x2160.mp4" type="video/mp4">
    
    </video>
    
    <div class="container " style="margin-top: 100px;">
      <h2 class="text-center mb-4">Agregar Nuevo Contacto</h2>
      <form>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ingresa el nombre" required>
        </div>
        <div class="mb-3">
          <label for="apellido" class="form-label">Apellido</label>
          <input type="text" class="form-control" id="apellido" placeholder="Ingresa el apellido" required>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" placeholder="Ingresa el correo" required>
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="text" class="form-control" id="telefono" placeholder="Ingresa el número de teléfono">
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Guardar Contacto</button>
          <a href="contacto.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
  </body>
</html>
