<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Login</title>
  <link rel="icon" type="image/png" href="assets/agenda.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="position-absolute start-50 translate-middle">
    <img src="assets/perfil2.png" alt="Perfil" width="200" height="200">
  </div>

  
  <video class="video-background" autoplay muted loop>
    <source src="assets/long-island.3840x2160.mp4" type="video/mp4">
    Tu navegador no soporta este video.
  </video>


  <div class="login-container">
    <form action="contacto.html" method="get" class="login">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Gmail</label>
        <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Ingresa tu correo">
        <div id="emailHelp" class="form-text">No compartiremos tu correo electrónico con nadie más</div>
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Recuérdame</label>
      </div>
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
